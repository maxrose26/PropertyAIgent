# Policy Intelligence monitored sources - registered here as data, not
# hardcoded inside app.policy.monitor's checking logic (Sprint 1 CTO-review
# amendment, Part 3; generalised in Sprint 2 - "Greater Manchester Policy
# Intelligence Framework" - Part 3: "Confirm source registration").
#
# Schema (per source, under councils.<code>.sources):
#   url                      - required
#   source_type              - required. One of: landing_page | adopted_plan |
#                               emerging_plan | timetable | consultation_portal |
#                               examination_library | policies_map |
#                               evidence_library | pdf | other
#   title                    - optional, human-readable label
#   plan_name / plan_version - OPTIONAL. Names the specific LocalPlan this
#                               source is tied to (matched the same way
#                               app.db.models.LocalPlan is uniquely
#                               constrained: council_code + plan_name +
#                               plan_version). Omit both for a council-level
#                               source (a landing page, a consultation
#                               portal) that isn't tied to one specific
#                               ingested plan/version - see
#                               app.policy.sources._resolve_local_plan_id.
#                               A plan_name that doesn't match any ingested
#                               LocalPlan yet is not an error - the source
#                               is still registered, just unlinked until a
#                               later registration call resolves it.
#   monitoring_frequency_days - optional, default 7.
#
# This file only says WHAT to watch; it has no opinion on HOW a source is
# checked (that's app.policy.monitor) or what a change to it means (that's
# app.policy.change_detection / app.policy.review).
councils:
  stockport:
    sources:
      - url: "https://live-iag-static-assets.s3.eu-west-1.amazonaws.com/pdf/Local+Plan+evidence/LocalPlan.pdf"
        source_type: emerging_plan
        title: "Stockport Local Plan (housing site allocations, pages 110-111)"
        plan_name: "Stockport Local Plan"
        plan_version: null

      # Sprint 3D ("Policy Document Coverage & Discovery", Part 5/10) -
      # confirmed via direct live research (real requests.get fetches
      # against stockport.gov.uk, not a search-engine summary) that
      # Stockport's Local Plan Policies Map is a single, unambiguous,
      # static PDF - "https://www.stockport.gov.uk/the-local-plan-
      # documents" lists it right alongside the already-registered Local
      # Plan PDF itself, same S3 bucket/folder, no competing candidates
      # found anywhere else, so this did NOT need Part 5's ambiguous-
      # candidate review queue. Sprint 3C's earlier finding ("the
      # allocation boundaries genuinely were not present" in the Local
      # Plan PDF) stands - they were never meant to be there; they live
      # here instead, in a document that had simply never been
      # registered before this sprint.
      - url: "https://live-iag-static-assets.s3.eu-west-1.amazonaws.com/pdf/Local+Plan+evidence/Local+Plan+Policies+Map+-+2025+October.pdf"
        source_type: policies_map
        title: "Stockport Local Plan Policies Map (2025 October)"
        plan_name: "Stockport Local Plan"
        plan_version: null

  bury:
    # Confirmed via direct research (WebFetch/pdfplumber against the
    # primary documents, not just a search summary) that Bury's OWN Local
    # Plan carries no site allocations of its own - the Borough's strategic
    # housing sites were allocated through the separately-adopted,
    # multi-borough Places for Everyone joint plan instead. Both documents
    # are genuinely different LocalPlan entities and are registered/
    # ingested as such - see Sprint 2's validation write-up
    # (specifications/003-policy-intelligence-v1.md) for why this is a
    # real structural difference from Stockport, not a workaround.
    sources:
      - url: "https://www.bury.gov.uk/planning-building-control/planning-policy/bury-local-plan"
        source_type: landing_page
        title: "Bury Local Plan landing page"
        # No plan_name - council-level source, watches for the plan's
        # existence/stage changing at all, not tied to one specific PDF.

      - url: "https://www.bury.gov.uk/asset-library/publication-local-plan-june-2026.pdf"
        source_type: emerging_plan
        title: "Bury Publication Local Plan (June 2026, Regulation 19)"
        plan_name: "Bury Local Plan"
        plan_version: "Publication June 2026"

      - url: "https://www.greatermanchester-ca.gov.uk/media/9578/places-for-everyone-joint-development-plan-document.pdf"
        source_type: adopted_plan
        title: "Places for Everyone Joint Development Plan (Bury allocations JPA7-9, pages 311-325)"
        plan_name: "Places for Everyone Joint Development Plan (Bury allocations)"
        plan_version: "2022-2039"

      # LPDI V1 Gate 1 ("Greater Manchester Document Discovery Closure") -
      # confirmed via direct live navigation (real page fetches against
      # bury.gov.uk, not a search-engine summary) that this ONE index page
      # lists "Housing land" evidence and "Monitoring reports" sections
      # together - an amr_page/housing_land_supply_page-shaped index in
      # substance, registered as the broader monitoring_page type since it
      # is not narrowly single-purpose. plan_name/plan_version match Bury's
      # own existing LocalPlan row exactly (verified against the database
      # at implementation time, not assumed from the entry above - see this
      # gate's own specification for why an exact plan_version match
      # matters here: a mismatch silently leaves local_plan_id unresolved).
      - url: "https://www.bury.gov.uk/planning-building-control/planning-policy/evidence-and-monitoring"
        source_type: monitoring_page
        title: "Bury Council - Evidence and monitoring (housing land, monitoring reports)"
        plan_name: "Bury Local Plan"
        plan_version: "Publication June 2026"

  salford:
    # GM Salford + Trafford Regulation 19 Local Plan Allocation Ingestion
    # task - confirmed via direct primary-source investigation (real
    # pdfplumber reads against the actual Publication document, not a
    # research-agent summary) that Salford's own emerging Local Plan
    # (Part Two: Core Strategy and Allocations, "SLP:CSA") is currently at
    # Regulation 19 Publication stage (published 31 July 2026, consultation
    # closes 25 September 2026) and carries its own numbered "Development
    # allocation N" sites within each neighbourhood policy's Part B
    # section - genuinely separate from, and NOT a re-designation of, the
    # 3 existing Places for Everyone allocations already in production for
    # Salford (Hazelhurst Farm, East of Boothstown, Port Salford
    # Extension). The plan's own text (p.92) explicitly names Hazelhurst
    # Farm and East of Boothstown as delivered "through PfE", confirming
    # they are not among this document's own allocations. THIS IS A
    # PROPOSED/SUBMISSION-STAGE PLAN, NOT ADOPTED - see
    # app.policy.status.derive_allocation_status_from_plan_status, which
    # must map allocations from this source to submitted/proposed
    # allocation status, never "adopted".
    sources:
      - url: "https://www.salford.gov.uk/planning-building-and-regeneration/planning-policies/local-planning-policy/salfords-development-plan/salford-local-plan/part-two-salford-local-plan/publication-local-plan-consultation-august-2026-to-september-2026/"
        source_type: landing_page
        title: "Salford Local Plan: Core Strategy and Allocations - Publication (Regulation 19) consultation page"
        # No plan_name - council-level source, watches for the
        # consultation/plan stage changing at all.

      - url: "https://www.salford.gov.uk/media/5h2edjxf/01-publication-slp-csa.pdf"
        source_type: emerging_plan
        title: "01. Publication Salford Local Plan: Core Strategy and Allocations (SLP:CSA) - development allocations in each neighbourhood's Part B section"
        plan_name: "Salford Local Plan: Core Strategy and Allocations"
        plan_version: "Publication July 2026"

      # LPDI V1 Gate 1 - confirmed via direct live navigation. plan_version
      # here ("Regulation 19 Publication") was verified against the
      # database's actual current LocalPlan.plan_version at implementation
      # time - it deliberately does NOT match the "Publication July 2026"
      # string used on the emerging_plan entry immediately above, which is
      # this file's own point-in-time label, not necessarily identical to
      # the live database value (see this gate's own specification for the
      # exact-match risk this reflects).
      - url: "https://www.salford.gov.uk/planning-building-and-regeneration/planning-policies/research-and-monitoring/"
        source_type: monitoring_page
        title: "Salford City Council - Planning policy research and monitoring (housing, monitoring)"
        plan_name: "Salford Local Plan: Core Strategy and Allocations"
        plan_version: "Regulation 19 Publication"

  trafford:
    # Same task as salford (above) - confirmed via direct primary-source
    # investigation that Trafford's own emerging Local Plan is currently
    # at Regulation 19 Publication stage (published 6 August 2026,
    # consultation closes 18 September 2026) and its Chapter 15 "Site
    # Allocations" carries 21 numbered site allocations (AN1-AN15,
    # AS1-AS4, AC1-AC2). The plan's own text (para 15.2) explicitly states
    # these allocations are "in addition to" - not overlapping with - the
    # two existing Places for Everyone strategic allocations already in
    # production for Trafford (New Carrington, Timperley Wedge/Davenport
    # Green). THIS IS A PROPOSED/SUBMISSION-STAGE PLAN, NOT ADOPTED - same
    # status-mapping requirement as salford, above.
    sources:
      - url: "https://www.trafford.gov.uk/planning-and-building-control/planning-policy-and-strategy/new-trafford-local-plan/regulation-19-publication-stage"
        source_type: landing_page
        title: "New Trafford Local Plan - Regulation 19 Publication Stage consultation page"
        # No plan_name - council-level source.

      - url: "https://tcintunestorage01.blob.core.windows.net/tc-drupal-repo/01LPW4SBYCMV73WSZOFJAIBROC2TF7QB7B_Trafford Local Plan 2022-2039 Publication Version (July 2026).pdf"
        source_type: emerging_plan
        title: "01. Trafford Local Plan 2022-2039 Publication Version (July 2026) - Chapter 15 Site Allocations, pages 290-455"
        plan_name: "Trafford Local Plan"
        plan_version: "Publication Version (July 2026)"

      # LPDI V1 Gate 1 - confirmed via direct live navigation (real page
      # fetches against trafford.gov.uk). This ONE index page lists SHLAA,
      # Housing Delivery Test, Authority Monitoring Report, Brownfield Land
      # Register, AND Five-year housing land position together - registered
      # as monitoring_page (not narrowly amr_page/housing_land_supply_page)
      # since it covers all of them. plan_version verified against the
      # database's actual current LocalPlan.plan_version at implementation
      # time - deliberately NOT the same string as the emerging_plan entry
      # above, which may not match the live value (see this gate's own
      # specification).
      - url: "https://www.trafford.gov.uk/planning-and-building-control/planning-policy-and-strategy/supporting-information-evidence-and-monitoring"
        source_type: monitoring_page
        title: "Trafford Council - Supporting information, evidence and monitoring (SHLAA, HDT, AMR, brownfield register, 5YHLS)"
        plan_name: "Trafford Local Plan"
        plan_version: "Regulation 19 Publication"

  # ============================================================
  # LPDI V1 Gate 1 ("Greater Manchester Document Discovery Closure") -
  # every source below was found and verified by direct live browser
  # navigation against the council's own real website (never a search-
  # engine summary, never AI-generated) - the same discipline the entries
  # above already established. Every plan_name/plan_version pairing was
  # checked against this platform's own current LocalPlan row at
  # implementation time. Where a council's real content is confirmed
  # STALE (an old AMR/5YHLS edition, not a current one), that is noted
  # explicitly rather than hidden - stale-but-real evidence is still
  # genuine evidence, never suppressed for looking dated. See
  # specifications/017-lpdi-v1-gate-1-document-discovery-closure.md for
  # the full audit trail and the two councils below (rochdale, tameside)
  # registered WITHOUT a plan_name, and why.
  # ============================================================

  bolton:
    sources:
      # Single index page covering the 5YHLS position statement, AMR, LDS,
      # SCI and HDT Action Plan together - confirmed live: at 1 April 2026
      # Bolton's own page states "3.61 years' supply" (genuinely current).
      - url: "https://www.bolton.gov.uk/planning-policy-strategy/planning-policy-supporting-information"
        source_type: monitoring_page
        title: "Bolton Council - Planning policy supporting information (5YHLS, AMR, LDS, HDT action plan)"
        plan_name: "Bolton's Allocations Plan"
        plan_version: "Adopted (3 December 2014, unrevised)"

      # Directly-registered document (matches this file's own Stockport-
      # style precedent for a specific, individually-verified PDF) - the
      # 5YHLS position statement itself, confirmed genuinely current
      # (1 April 2026 base date, "3.61 years' supply").
      - url: "https://www.bolton.gov.uk/downloads/file/7609/bolton-five-year-housing-land-supply-position-statement"
        source_type: housing_land_supply_statement
        title: "Bolton Five Year Housing Land Supply Position Statement (base date 1 April 2026)"
        plan_name: "Bolton's Allocations Plan"
        plan_version: "Adopted (3 December 2014, unrevised)"

      # KNOWN STALE, registered anyway (Section 12/14 of this gate's own
      # task - "not stated" is preferable to an INVENTED figure, but a
      # real, dated, stale figure is still genuine evidence, not something
      # to suppress). Bolton's own page states its "latest report" is the
      # 2019/20 combined report - the extracted reporting_period will
      # reflect this honestly once processed.
      - url: "https://www.bolton.gov.uk/downloads/file/2549/authority-monitoring-report-2018-19"
        source_type: authority_monitoring_report
        title: "Bolton Authority Monitoring Report (2018/19 - the latest edition Bolton's own site currently links)"
        plan_name: "Bolton's Allocations Plan"
        plan_version: "Adopted (3 December 2014, unrevised)"

  manchester:
    sources:
      - url: "https://www.manchester.gov.uk/planning-and-regeneration/planning/authority-monitoring-report"
        source_type: amr_page
        title: "Manchester City Council - Authority Monitoring Report (2025 AMRs available, plus 2012-2024 archive)"
        plan_name: "Draft Manchester Local Plan (September 2025)"
        plan_version: "Regulation 18 draft"

      # KNOWN STALE - confirmed live: Manchester's own page states this
      # statement sets out the position "from 1 April 2019" and lists only
      # a single "Five Year Housing Land Supply Statement 2019" document -
      # registered anyway, honestly, per the same "stale but real" rule as
      # Bolton's AMR above.
      - url: "https://www.manchester.gov.uk/planning-and-regeneration/planning/five-year-housing-land-supply-statement"
        source_type: housing_land_supply_page
        title: "Manchester City Council - Five Year Housing Land Supply Statement (2019 edition - the only one currently linked)"
        plan_name: "Draft Manchester Local Plan (September 2025)"
        plan_version: "Regulation 18 draft"

  oldham:
    sources:
      # Single index page - "Monitoring reports", SHLAA, Brownfield
      # Register, Housing Delivery Action Plan, Infrastructure Funding
      # Statement together.
      - url: "https://www.oldham.gov.uk/info/201230/monitoring"
        source_type: monitoring_page
        title: "Oldham Council - Monitoring (monitoring reports, SHLAA, brownfield register, HDT action plan)"
        plan_name: "Oldham Saved Unitary Development Plan (Policy H1, saved allocations)"
        plan_version: "Adopted (saved UDP)"

  rochdale:
    sources:
      # NO plan_name (Section 6/12 of this gate's own task - do not invent
      # a supersession/attribution rule where the architecture doesn't
      # support one) - Rochdale has NO independent LocalPlan row of its
      # own in this database (confirmed via direct query at implementation
      # time); it is currently known to this platform only through its
      # LocalPlanCouncil "participating_authority" link to the SHARED
      # Places for Everyone plan row (id 2). That shared row's own
      # scalar housing-delivery fields cannot safely hold Rochdale's own,
      # genuinely distinct AMR figures without silently conflating them
      # with Bolton's/Oldham's/etc. - registering this source as council-
      # level (local_plan_id left null, a valid, documented steady state
      # per app.policy.sources' own docstring) is the correct, honest
      # action until Rochdale has its own independent LocalPlan row -
      # a separately-roadmapped item (PRODUCT_ROADMAP.md §2, "Independent
      # Local Plan monitoring for the remaining 8 GM authorities"), not
      # something this gate's own narrow scope should silently expand
      # into. See this gate's own specification for the full reasoning.
      - url: "https://www.rochdale.gov.uk/planning-policy/authority-monitoring-reports"
        source_type: amr_page
        title: "Rochdale Borough Council - Authority Monitoring Reports (current edition updated May 2025, covers 1 Apr 2022 - 31 Mar 2023)"
        # No plan_name - see comment above.

  tameside:
    sources:
      # NO plan_name (same discipline as rochdale, above, for a different
      # reason) - Tameside has TWO existing LocalPlan rows (the emerging
      # "Homes, Spaces, Places" preferred-option plan, and the adopted
      # saved "Unitary Development Plan"), and Tameside's own single real
      # monitoring page does not distinguish which plan its AMR/housing
      # figures belong to - guessing would risk silently misattributing
      # evidence to the wrong plan row. Registered as council-level
      # (local_plan_id left null) pending a Product Owner decision on
      # which plan this evidence should attach to - see this gate's own
      # specification.
      - url: "https://www.tameside.gov.uk/planning/ldf/planningmonitoring"
        source_type: amr_page
        title: "Tameside Council - Authority's Monitoring Report"
        # No plan_name - see comment above.

  wigan:
    sources:
      # Single index page - "Other statutory documents": Local Plan
      # evidence base, LDS, SCI, Authority Monitoring Report, Infrastructure
      # Funding Statement, Brownfield Land Register together.
      - url: "https://www.wigan.gov.uk/Council/Strategies-Plans-and-Policies/Planning/Local-plan/Background/Background.aspx"
        source_type: monitoring_page
        title: "Wigan Council - Other statutory documents (AMR, brownfield register, LDS, SCI)"
        plan_name: "Wigan Borough Local Plan: Planning for the Future to 2040 (Initial Draft)"
        plan_version: "Regulation 18 Initial Draft (confirmed current)"

# --- Cross-boundary allocations (Part 3) ---
#
# Table 11.1 labels JPA1.1, JPA1.2, JPA2, JPA3.1 and JPA3.2 "Cross
# Boundary" rather than naming one district. Every one of them, on
# individual investigation, DOES have a single real host authority
# (confirmed per-entry below) - "Cross Boundary" describes the wider
# strategic grouping (the Atom Valley MDZ; the Manchester Airport
# Strategic Location), not a genuine single-site multi-council span. Per
# CLAUDE.md's "never invent" and this sprint's own "never infer
# boundaries", each is marked review_status="needs_confirmation" rather
# than "auto_applied" - the evidence is real and cited, but is
# place-name/cross-reference-based rather than an explicit "this
# allocation sits within [Council]'s boundary" sentence in the plan's own
# text, so a human should confirm before this is treated as fully trusted.
#
# Northern Gateway (JPA1.1 + JPA1.2) is additionally a genuine duplicate-
# across-plans case, the same pattern Sprint 3E already resolved for
# Seedfield/Walshaw/Elton Reservoir: Bury's OWN Local Plan separately
# already carries two rows for "Northern Gateway" (policy_reference
# JPA1.1/JPA1.2, ids matched at runtime by council_code=bury AND
# plan_name="Bury Local Plan" AND site_name="Northern Gateway") - these
# are NOT recreated; instead an AllocationRelationship links the new
# PfE-scoped rows to them (same_physical_site), reusing Sprint 3E's exact
# reconciliation architecture rather than inventing a new one.
cross_boundary_allocations:
  - policy_reference: "JPA 1.1"
    site_name: "Heywood / Pilsworth (Northern Gateway)"
    council_code: rochdale
    intended_use: employment
    minimum_dwellings: null
    category: "Cross Boundary (Atom Valley MDZ) - employment, c.1,200,000 sqm industrial/warehousing"
    source_page: 260
    review_status: needs_confirmation
    confidence_note: >
      Table 11.1 (p.253) labels this "Cross Boundary". Attributed to
      Rochdale on real-world place-name evidence (Heywood is a Rochdale
      MBC town) - the plan's own policy text (p.260) does not itself name
      a single administering council. Genuinely spans the Bury/Rochdale
      boundary as part of the same Northern Gateway MDZ as JPA1.2 (Bury) -
      see the AllocationRelationship linking both JPA1.1 and JPA1.2, and
      linking JPA1.1 to Bury's own pre-existing "Northern Gateway" row.
    link_to_bury_local_plan_site: "Northern Gateway"  # site_name match within plan_name="Bury Local Plan"
    sibling_reference: "JPA 1.2"

  - policy_reference: "JPA 1.2"
    site_name: "Simister and Bowlee (Northern Gateway)"
    council_code: bury
    intended_use: residential
    minimum_dwellings: 1550
    category: "Cross Boundary (Atom Valley MDZ) - residential"
    source_page: 269
    review_status: needs_confirmation
    confidence_note: >
      Table 11.1 (p.253) labels this "Cross Boundary". Attributed to Bury
      with high confidence - Bury's own separately-ingested Local Plan
      independently already names "Northern Gateway" (the same MDZ) as
      its own allocation (policy_reference JPA1.1/JPA1.2), corroborating
      this from a second, independent source document, not just PfE's own
      naming.
    link_to_bury_local_plan_site: "Northern Gateway"
    sibling_reference: "JPA 1.1"

  - policy_reference: "JPA 2"
    site_name: "Stakehill"
    council_code: rochdale
    intended_use: employment
    minimum_dwellings: null
    category: "Cross Boundary (Atom Valley MDZ) - employment, c.150,000 sqm industrial/warehousing"
    source_page: 274
    review_status: needs_confirmation
    confidence_note: >
      Table 11.1 (p.253) labels this "Cross Boundary", but Appendix B.1
      "List of Places for Everyone Green Belt Additions" (p.522) is
      explicit: "Rochdale ... Land to west of Stakehill Business Park" -
      the plan's own second table directly confirms Rochdale as the
      administering authority. Kept needs_confirmation (not auto_applied)
      only because this resolves Table 11.1's own ambiguous label via a
      cross-reference within the same document, not a single explicit
      sentence naming the council on Stakehill's own policy page.

  - policy_reference: "JPA 3.1"
    site_name: "Medipark"
    council_code: trafford
    intended_use: employment
    minimum_dwellings: null
    category: "Cross Boundary (Manchester Airport Strategic Location) - employment, health/biotech cluster"
    source_page: 282
    review_status: needs_confirmation
    confidence_note: >
      Table 11.1 does not list JPA3.1 individually (grouped under the
      Medipark/Timperley Wedge introduction, p.282); the wider chapter
      (p.81) explicitly distinguishes Medipark/Timperley Wedge from
      "Airport City" and "Manchester Local Plan" - implying these two PfE
      allocations sit OUTSIDE Manchester's own boundary. Attributed to
      Trafford on real-world place-name evidence (Roundthorn Industrial
      Estate, paired here with Medipark, sits within Trafford) - not an
      explicit single sentence naming the council.

  - policy_reference: "JPA 3.2"
    site_name: "Timperley Wedge"
    council_code: trafford
    intended_use: mixed use
    minimum_dwellings: 1800
    category: "Cross Boundary (Manchester Airport Strategic Location) - c.1,800 homes plus c.60,000 sqm office floorspace"
    source_page: 287
    review_status: needs_confirmation
    confidence_note: >
      Table 11.1 does not list JPA3.2 individually (see JPA3.1's note).
      Attributed to Trafford on real-world place-name evidence (Timperley
      is a Trafford suburb) - high confidence but not an explicit single
      sentence in the plan naming the council, hence needs_confirmation
      rather than auto_applied.

#   - district/council: Table 11.1 "List of Places for Everyone Allocations"
#     (pages 253-255), cross-checked against Appendix B.1 "List of Places
#     for Everyone Green Belt Additions" (page 522) where Table 11.1 itself
#     only said "Cross Boundary" - see the "cross_boundary" section below
#     for exactly which evidence resolved each one.
#   - capacity/intended_use/source_page: each allocation's own "Policy JP
#     Allocation N" policy section, read directly (page numbers below).
#
# council_code values match config/councils.yaml's existing codes exactly -
# no new councils are onboarded (application scraping is NOT enabled for
# any of these 7 beyond what Sprint 3E's LocalPlanCouncil already granted:
# visibility of the Places for Everyone PLAN itself, not its allocations).
#
# local_plan_id is resolved at runtime by plan_name/plan_version (matching
# LocalPlan's own uniqueness triple), never hardcoded as a raw id, so this
# file stays valid if a fresh database assigns a different id.

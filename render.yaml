# Render Blueprint - Pilot Readiness PR-2 ("Production Scheduling").
#
# This file adds TWO Cron Job services, deliberately separate (Pilot
# Readiness PR-2 final pre-merge amendment, "Automated Intelligence
# Cadence" / "Render Architecture" - Product Owner review: "do not couple
# them so tightly that a scraping failure prevents existing queued
# intelligence work from being processed... prefer separate jobs/services
# if this provides better fault isolation"):
#   1. propertyaigent-daily-scrape         - Daily Discovery (deterministic
#      scraping/document-collection only, scripts/run_daily_councils.py)
#   2. propertyaigent-intelligence-processing - bounded AI extraction/
#      summary generation (scripts/run_intelligence_processing.py)
# It does not define the existing Streamlit web service, which - per this
# sprint's own PR-2 architecture audit - was almost certainly created
# manually in the Render dashboard rather than from a Blueprint (no
# render.yaml existed in this repository before this sprint, and the web
# service has no corresponding entry here). Applying this Blueprint
# therefore creates or updates exactly these two Cron Job services and
# nothing else - it cannot recreate, modify, or interfere with the
# existing web service.
#
# IMPORTANT - what this file does NOT do by itself:
#   Committing this file to the repository does not create or schedule
#   anything in Render. Render only acts on a render.yaml when you
#   explicitly "New +" -> "Blueprint" (or "Sync Blueprint" on an existing
#   Blueprint-linked repo) in the Render dashboard, pointed at this repo.
#   See the production-scheduling architecture note in
#   docs/PLATFORM_ARCHITECTURE.md §1 (and this sprint's final report) for
#   the exact manual steps, including which environment variables must be
#   set in the Render dashboard (this file deliberately does not - and
#   cannot - contain any secret's actual value) and the required
#   deployment ORDER (schema migration before either cron job runs - see
#   scripts/migrate_schema.py's own docstring).
#
# This is IMPLEMENTED (the repository side). It is NOT DEPLOYED and NOT
# VERIFIED RUNNING until an operator with Render dashboard access completes
# the manual steps above and confirms a real run in Render's own logs.
#
# ENVIRONMENT VARIABLES - each job declares only what it genuinely needs
# (Pilot Readiness PR-2 pre-merge + final pre-merge architecture checks,
# "Render Blueprint Safety" / "Render Architecture"):
#   Daily Discovery (propertyaigent-daily-scrape):
#     DATABASE_URL              REQUIRED. The pipeline cannot run at all
#                                without it.
#     PLAYWRIGHT_BROWSERS_PATH  Set to "0" (see "BUILD/RUNTIME" note below)
#                                - not a secret, a plain Playwright config
#                                constant, safe to commit directly.
#     OPENAI_API_KEY  NOT required. scripts/run_daily_councils.py passes
#                     --skip-extraction --skip-scheme-summary on every
#                     subprocess invocation unless started with
#                     --include-ai-stages (an operator's own explicit,
#                     manually-triggered choice, not this scheduled job's
#                     default) - see that script's own docstring ("AI cost
#                     safety") for the full reasoning.
#     EPC_API_KEY     NOT required. app.enrichment.epc_lookup.
#                     check_build_status degrades gracefully to
#                     status="unknown" when absent (confirmed in code - no
#                     crash) - improves build-status accuracy if set, but
#                     the daily discovery/document job runs correctly
#                     without it.
#   Intelligence Processing (propertyaigent-intelligence-processing):
#     DATABASE_URL    REQUIRED, same reason as above.
#     OPENAI_API_KEY  REQUIRED. This job's entire purpose is calling
#                     run_weekly.py's stage_extraction/stage_generate_
#                     scheme_summaries, both of which call the OpenAI API -
#                     see scripts/run_intelligence_processing.py's own
#                     docstring for the one exception (a run with zero
#                     outstanding work never reads this variable at all,
#                     but the Cron Job's own environment must still have it
#                     available for every run that DOES find work).
#     EPC_API_KEY     NOT required. This job never calls
#                     stage_check_build_status or anything else that
#                     touches EPC data.
# No secret's actual value is ever declared below (sync: false everywhere
# a real secret is required) - requiring a secret a job does not genuinely
# need is itself a safety risk (unnecessary exposure, unnecessary operator
# setup friction).
#
# BUILD/RUNTIME (Render Cron Job Playwright build hotfix - "Switching to
# root user to install dependencies... su: Authentication failure" observed
# on the first real Blueprint sync):
#   Daily Discovery's build previously ran
#     playwright install --with-deps chromium
#   `--with-deps` doesn't just download the Chromium binary - it ALSO
#   apt-get installs the OS-level shared libraries Chromium needs, and
#   Playwright's own install-deps step escalates to root (sudo/su) to run
#   that apt-get. Render's native Python build container has no
#   interactive root/sudo access, so that escalation fails outright - a
#   build-environment mismatch, not a scraping or code bug. Fixed by
#   dropping --with-deps: `playwright install chromium` alone only
#   downloads the compiled binary over plain HTTP - no apt-get, no su/sudo,
#   no root ever involved. Immediately followed by
#   `python -m scripts.verify_browser_runtime` (see that script's own
#   docstring) so a still-missing OS shared library turns into an
#   unambiguous BUILD failure right away, rather than a cryptic scrape
#   failure discovered only at the next 05:00 UTC scheduled run.
#
#   SECOND hotfix (Render Daily Discovery runtime failure, all 10 councils
#   failed identically after the build-hotfix build itself succeeded):
#   read-only inspection of the resulting ScrapeRun rows' own `detail` text
#   showed every single failure was the exact same
#     playwright._impl._errors.Error: BrowserType.launch: Executable
#     doesn't exist at /opt/render/.cache/ms-playwright/
#     chromium_headless_shell-<rev>/chrome-headless-shell-linux64/
#     chrome-headless-shell
#   - i.e. the browser build's own build-time canary passed (the binary
#   WAS present in that default cache directory during the build
#   container), but had vanished by the time the Cron Job's own scheduled
#   run actually executed run_weekly.py's `p.chromium.launch(headless=True)`
#   - Render Cron Jobs do not guarantee that a home-directory cache
#   (`~/.cache/ms-playwright`, outside the project's own dependency tree)
#   written during build persists into a later scheduled run's container.
#   Fixed by setting PLAYWRIGHT_BROWSERS_PATH=0 (Playwright's own
#   documented mechanism for exactly this "browsers vanish between build
#   and run in ephemeral CI/PaaS environments" class of problem) - this
#   makes `playwright install chromium` download the browser INSIDE the
#   playwright package's own installed directory
#   (.venv/lib/.../playwright/driver/package/.local-browsers/), which is
#   part of the same dependency tree `pip install -r requirements.txt`
#   already manages and is therefore guaranteed to be present for every
#   run, not a separate cache that may or may not survive between build
#   and run. Verified locally: with this variable set, `playwright install
#   chromium` downloads into the project's own .venv tree, and
#   verify_browser_runtime.py's canary still launches and closes Chromium
#   successfully from there.
#
#   Every council (idox, idox_anite, arcus doc_system alike) is scraped
#   through the one shared Playwright Chromium session run_weekly.py's own
#   main() opens - Playwright is required unconditionally for Daily
#   Discovery, for all 10 councils, not just some, so PLAYWRIGHT_BROWSERS_
#   PATH must be set for this Cron Job's own run environment (not just its
#   build), since Playwright reads this variable at BOTH install time and
#   launch time to agree on where to look.
#
#   Intelligence Processing's own buildCommand deliberately has NO
#   playwright install step at all (not even without --with-deps), and
#   does not need PLAYWRIGHT_BROWSERS_PATH either -
#   scripts/run_intelligence_processing.py never launches a browser (it
#   only calls run_weekly.py's stage_extraction/stage_generate_scheme_
#   summaries, neither of which touches Playwright); importing app.
#   pipeline.run_weekly still imports the playwright PYTHON PACKAGE at
#   module level, which `pip install -r requirements.txt` alone already
#   satisfies - only actually LAUNCHING a browser needs the binary
#   download step, and this job never does that.
#
#   If Render's base image is ever found to be missing a Chromium shared
#   library even after these fixes (verify_browser_runtime.py's own
#   failure message will say so explicitly in the build log), the next
#   escalation is a Docker-based Cron Job runtime using the official
#   Playwright image (mcr.microsoft.com/playwright/python), which ships
#   Chromium with every OS dependency already baked into the image - not
#   attempted here since there is no current evidence it's needed, and it
#   is meaningfully more infrastructure than these fixes required.

services:
  - type: cron
    name: propertyaigent-daily-scrape
    runtime: python
    # Render Daily Discovery missing-runtime-logs diagnosis: this was found
    # declaring "starter" (512Mi) here despite production having genuinely
    # run on Standard/2Gi for weeks - a real Blueprint/dashboard config-
    # drift defect, not a typo. Any future "Sync Blueprint" would have
    # silently reverted the live service back to 512Mi, which - given this
    # job's own real Chromium/multi-council memory footprint - would make
    # an OOM kill MORE likely, not less. Declared explicitly here so a sync
    # can no longer regress the effective plan; see
    # tests/test_render_discovery_missing_runtime_logs.py for the
    # regression guard.
    plan: standard
    # Once a day. Render cron schedules are UTC - 05:00 UTC is before the
    # UK working day starts, matching this platform's existing
    # scripts/register_weekly_task.ps1 local-dev precedent of running
    # overnight/early morning rather than during business hours.
    schedule: "0 5 * * *"
    buildCommand: "pip install -r requirements.txt && playwright install chromium && python -m scripts.verify_browser_runtime"
    # -u (unbuffered stdout/stderr) - Render Daily Discovery missing-
    # runtime-logs diagnosis: the CHILD run_weekly.py subprocess was
    # already launched with -u (see scripts/run_daily_councils.py), but
    # this PARENT process itself was not. Two consecutive real 2Gi OOM
    # production runs showed ZERO [mem] lines, zero streamed council
    # output, and zero "starting"/"OK"/"FAILED" lines in Render's log
    # viewer between "Running python -m scripts.run_daily_councils" and
    # the OOM kill - confirmed root cause: CPython block-buffers stdout
    # whenever it is not attached to a real terminal (i.e. always, when
    # Render captures a Cron Job's output via a pipe), so every print()
    # this PARENT process itself made was sitting unflushed in ITS OWN
    # stdout buffer, and a SIGKILL from the OOM killer gives Python no
    # chance to flush it on the way out - the buffer, and everything in
    # it, is simply gone. -u fixes this at the interpreter level. Not
    # relied on alone - see PYTHONUNBUFFERED below and this module's own
    # flush=True on every critical print, so the fix does not depend on
    # only one buffering assumption holding.
    startCommand: "python -u -m scripts.run_daily_councils"
    envVars:
      # Value is set in the Render dashboard, never committed here -
      # sync: false means "this variable is required but Render will not
      # generate or store a value for it automatically; an operator must
      # set it manually", the correct declaration for a secret this
      # Blueprint needs to exist but must never contain.
      - key: DATABASE_URL
        sync: false
      # NOT a secret - a literal Playwright configuration constant, safe
      # to commit directly (value:, not sync: false). See the "BUILD/
      # RUNTIME" header comment above ("Render Daily Discovery runtime
      # failure") for the full diagnosis - without this, the browser
      # installed during build is not guaranteed to still be present when
      # the Cron Job's own scheduled run actually launches it.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      # NOT a secret - belt-and-braces alongside startCommand's own -u
      # flag (Render Daily Discovery missing-runtime-logs diagnosis, "Do
      # not rely on only one fragile buffering assumption") - guarantees
      # unbuffered stdout/stderr even if a future manual dashboard change
      # ever overrides startCommand and drops the -u flag.
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: cron
    name: propertyaigent-intelligence-processing
    runtime: python
    plan: starter
    # 07:00 UTC - two hours after Daily Discovery's 05:00 UTC start, giving
    # a normal-length discovery run (all 10 councils) time to finish and
    # commit its data first, while still keeping the two jobs as separate,
    # independently-schedulable services rather than one calling the other
    # (Part 7: "do not couple them so tightly that a scraping failure
    # prevents existing queued intelligence work from being processed" - a
    # failed or slow Discovery run does not block this job from running
    # and processing whatever backlog already exists from EARLIER days).
    schedule: "0 7 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m scripts.run_intelligence_processing"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # PROPERTYAIGENT_MAX_EXTRACTIONS_PER_RUN / _MAX_SUMMARIES_PER_RUN are
      # deliberately NOT declared here - scripts/run_intelligence_
      # processing.py already has conservative built-in defaults (20/20)
      # when unset, and these are workload TUNING knobs, not secrets or
      # required configuration - an operator can add them later via the
      # Render dashboard (or --max-extractions/--max-summaries) without
      # needing a Blueprint change first.

  # ==========================================================================
  # TEMPORARY ONE-OFF HISTORICAL BACKFILL JOB - NOT PERMANENT INFRASTRUCTURE
  # ==========================================================================
  # Historical B3 Rebuild - Unattended Overnight Runner. A TEMPORARY,
  # separate, operator-triggered one-off job for the remaining ~625-
  # application historical rebuild backlog - deliberately NOT wired into
  # either of the two schedules above.
  #
  # RENDER CAPABILITY AUDIT (Historical Rebuild Overnight Runner, Final
  # Pre-Merge Lifecycle Safety Amendment): confirmed against Render's own
  # published Blueprint YAML reference (render.com/docs/blueprint-spec) and
  # Cron Job docs (render.com/docs/cronjobs) that `schedule` is a REQUIRED
  # field for a `type: cron` Blueprint service, specified as a cron
  # expression - there is no documented `suspend`/`suspended`/`enabled`/
  # manual-only field for a Blueprint cron job, and no documented way to
  # define one in render.yaml with automatic scheduling disabled entirely.
  # The only genuine "run this deliberately, right now" mechanism Render
  # documents is the dashboard's own "Trigger Run" action, which is exactly
  # how this job is intended to be run - the schedule below is therefore
  # NOT the real trigger, only a config-format requirement.
  #
  # INTENDED TRIGGER: this job's own "Trigger Run" button in the Render
  # dashboard, at a time an operator has deliberately chosen - NEVER its
  # own schedule.
  #
  # WHY 03:00 UTC ON 1 JANUARY: technically still a valid RECURRING cron
  # expression (once a year), but chosen as the lowest-frequency legitimate
  # value Render's required cron-expression format allows, since no
  # genuine "disabled"/manual-only value exists. Do not treat this as
  # equivalent to disabled - it is the safest available approximation, not
  # a guarantee against ever firing unattended.
  #
  # A Render Cron Job is still the correct native primitive here (audited
  # against the alternatives: a Background Worker auto-restarts on exit,
  # explicitly unwanted for a job that must terminate permanently once the
  # backlog is exhausted; a Web Service must bind to a port, the wrong
  # execution model entirely) - the SAME primitive already proven for
  # Daily Discovery/Intelligence Processing above. Once triggered, the job
  # runs entirely inside Render using Render's own DATABASE_URL/
  # OPENAI_API_KEY - it survives a disconnected browser/Shell/Claude
  # session by construction, since none of those are involved in its
  # execution once started. See scripts/run_historical_rebuild_to_
  # completion.py's own docstring for the full batching/stop-condition
  # design; it calls the SAME, unmodified app.extraction.historical_
  # rebuild.run_historical_rebuild() every existing historical rebuild
  # tooling already uses - no second rebuild engine exists.
  #
  # MANDATORY POST-REBUILD CLEANUP (required operational step, not
  # optional): once the historical backlog is fully rebuilt AND morning
  # verification AND Product Owner acceptance have both happened, the next
  # task must REMOVE this entire service entry from render.yaml, merge that
  # removal, "Sync Blueprint" in the Render dashboard, and confirm the
  # propertyaigent-historical-rebuild-overnight service no longer exists in
  # Render. This entry must never be left in render.yaml indefinitely as if
  # it were permanent scheduled production infrastructure - it is not.
  - type: cron
    name: propertyaigent-historical-rebuild-overnight
    runtime: python
    plan: starter
    schedule: "0 3 1 1 *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u -m scripts.run_historical_rebuild_to_completion"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Same belt-and-braces reasoning as Daily Discovery's own -u flag
      # above (Render Daily Discovery missing-runtime-logs diagnosis) -
      # this job's overnight log is the ONLY morning-review artifact if
      # something goes wrong, so unbuffered output must not depend on a
      # single fragile assumption.
      - key: PYTHONUNBUFFERED
        value: "1"

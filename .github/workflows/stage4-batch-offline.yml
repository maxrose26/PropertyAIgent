name: Stage4 reusable batch OFFLINE disposable
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'verification/direct_reference/**'
      - 'verification/b20_native/**'
      - 'tests/test_stage4*persistence*'
      - 'tests/test_stage4_batch.py'
      - 'tests/test_stage4_batch_registration.py'
      - 'tests/test_stage4_catchup.py'
      - 'tests/test_stage4_status_only.py'
      - 'tests/test_stage4_closure.py'
      - '.github/workflows/stage4-closure-*-production-once.yml'
      - '.github/workflows/stage4-catchup-*-production-once.yml'
      - '.github/workflows/stage4-batch-production-once.yml'
      - 'tests/test_stage4_direct_reference.py'
      - 'tests/test_stage4_direct_registration.py'
      - 'app/pipeline/status_verification.py'
      - 'app/pipeline/bolton_initial_status.py'
      - 'app/pipeline/run_weekly.py'
      - '.github/workflows/stage4-batch-offline.yml'
      - '.github/workflows/stage4-route-preflight-once.yml'
      - 'tests/test_oldham_production_registration.py'
      - '.github/workflows/stage4-route-qualified-material-admission-once.yml'
      - '.github/workflows/stage4-r0-source-date-once.yml'
      - '.github/workflows/stage4-r0-identity-comparison-once.yml'
      - '.github/workflows/stage4-r0-untouched-recovery-once.yml'
      - '.github/workflows/stage4-r0-fixed80-qualification-once.yml'
      - '.github/workflows/stage4-r0-untouched27-once.yml'
      - '.github/workflows/stage4-r0-untouched20-once.yml'
      - '.github/workflows/stage4-r0-bolton53-qualification-once.yml'
      - '.github/workflows/stage4-r0-untouched16-once.yml'
      - '.github/workflows/stage4-r0-untouched9-once.yml'
      - 'tests/test_discovery_r0_registration.py'
      - '.github/workflows/stage4-discovery-offline.yml'
      - 'verification/discovery/material_admission_route_qualified.py'
      - 'tests/test_discovery_admission_proposal.py'
      - 'tests/test_discovery_route_validation.py'
      - 'tests/test_discovery_r0_proposal.py'
      - 'verification/discovery/r0_proposal.py'
      - 'verification/discovery/r0_registered_scopes.py'
      - 'verification/discovery/r0_exact16.py'
      - 'verification/discovery/r0_exact9.py'
      - 'verification/discovery/r0_parent_metadata.py'
      - 'tests/test_discovery_exact9_registration.py'
      - 'tests/test_discovery_parent_controls.py'
      - 'verification/discovery/bolton_parent_metadata.py'
      - 'verification/discovery/finite_acceptance.py'
      - 'app/pipeline/discovery_screening.py'
      - 'tests/test_discovery_capped_criteria_screening.py'
      - 'tests/test_discovery_exact9_parent_preparation.py'
      - 'verification/discovery/criteria_containment.py'
      - 'verification/discovery/arcus_ui_window.py'
      - 'tests/test_discovery_exact16_proposal.py'
      - 'tests/test_discovery_exact16_registration.py'
      - 'verification/discovery/source_diagnostics.py'
      - 'verification/discovery/material_qualification.py'
      - 'verification/discovery/idox_window.py'
      - 'tests/test_discovery_initial_application_contract.py'
      - 'tests/test_discovery_bolton53_registration.py'
      - 'verification/discovery/r0_recovery_proposal.py'
      - 'verification/discovery/r0_fixed80_qualification.py'
      - 'verification/discovery/r0_bolton53_qualification.py'
      - 'tests/test_discovery_r0_registered_scopes.py'
      - 'docs/design/stage4-r0-execution/**'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: git fetch --no-tags --depth=1 origin 27966c34d1b4dbb88c15cd59d0805d55b14af9a7
      - run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/direct-test-venv"
      - name: Network-denied registration and accepted regressions
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/direct-test-venv/bin/python" verification/ah-offline-pytest.py tests/test_discovery_exact9_registration.py tests/test_discovery_parent_controls.py tests/test_discovery_capped_criteria_screening.py tests/test_discovery_exact9_parent_preparation.py tests/test_discovery_exact16_registration.py tests/test_discovery_exact16_proposal.py tests/test_discovery_bolton53_registration.py tests/test_discovery_initial_application_contract.py tests/test_discovery_r0_registered_scopes.py -p verification.stage1_preservation_plugin tests/test_discovery_r0_registration.py tests/test_stage4_closure.py tests/test_stage4_status_only.py tests/test_stage4_catchup.py tests/test_stage4_batch_registration.py tests/test_stage4_batch.py tests/test_oldham_production_registration.py tests/test_stage4_persistence_acceptance.py tests/test_stage4_direct_reference.py tests/test_stage4_direct_registration.py tests/test_stage26b_b20.py tests/test_stage26b_b21.py tests/test_planning_status_verification.py verification/test_stage1_access.py verification/test_stage1_outbound.py -q --junitxml="$RUNNER_TEMP/direct-registration.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-offline-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/direct-registration.xml
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: b20_disposable
          POSTGRES_DB: b20_disposable
          POSTGRES_PASSWORD: b20-disposable-only
        ports:
          - '127.0.0.1::5432'
        options: >-
          --health-cmd "pg_isready -U b20_disposable -d b20_disposable"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 3
      - name: Install pinned dependencies
        run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/b20-native-venv"
      - name: Frozen live facts in disposable PostgreSQL transactions
        env:
          B20_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          BATCH_REPOSITORY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b20-native-evidence"
          env -i HOME=/tmp PATH=/usr/bin:/bin B20_DISPOSABLE=YES_SYNTHETIC_ONLY B20_POSTGRES_PORT="$B20_POSTGRES_PORT" BATCH_REPOSITORY_SHA="$BATCH_REPOSITORY_SHA" BATCH_EVIDENCE_DIR="$RUNNER_TEMP/b20-native-evidence" PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 "$RUNNER_TEMP/b20-native-venv/bin/python" -m pytest -v -s -p no:cacheprovider verification/direct_reference/batch_native.py verification/b20_native/test_postgres.py --junitxml="$RUNNER_TEMP/b20-native-evidence/native.xml" 2>&1 | tee "$RUNNER_TEMP/b20-native-evidence/native.log"
      - name: Stop disposable PostgreSQL
        if: always()
        env:
          B20_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/b20-native-evidence"
          docker stop "$B20_SERVICE_ID"
          docker inspect --format '{{json .State}}' "$B20_SERVICE_ID" > "$RUNNER_TEMP/b20-native-evidence/service-stop.json"
          test "$(docker inspect --format '{{.State.Running}}' "$B20_SERVICE_ID")" = false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/b20-native-evidence/
          retention-days: 7

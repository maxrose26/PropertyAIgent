name: Reviewed intake scope OFFLINE
on:
  pull_request:
    paths:
      - 'verification/ingestion_storage/**'
      - 'scripts/owner_intake_scope.py'
      - 'scripts/owner_pilot_job.py'
      - 'tests/test_intake_scope*'
      - 'tests/test_bolton_canary_preparation.py'
      - 'tests/test_period10_successor_pg.py'
      - '.github/workflows/intake-scope-offline.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: provisioning_bootstrap
          POSTGRES_PASSWORD: disposable_fixture_only
          POSTGRES_DB: ingestion_provisioning_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U provisioning_bootstrap -d ingestion_provisioning_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: timeout 90s bash verification/ah_pg/setup.sh "$RUNNER_TEMP/scope-venv"
      - run: timeout 540s "$RUNNER_TEMP/scope-venv/bin/python" -m pytest tests/test_bolton_canary_preparation.py tests/test_intake_scope_pg.py -q --tb=short --junitxml="$RUNNER_TEMP/scope.xml"
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          INGESTION_PROVISIONING_TEST_URL: postgresql://provisioning_bootstrap:disposable_fixture_only@127.0.0.1:5432/ingestion_provisioning_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-scope-pg
          path: ${{ runner.temp }}/scope.xml

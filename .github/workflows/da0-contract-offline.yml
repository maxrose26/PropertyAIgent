name: DA0 offline contracts
on:
  push:
    branches: [feat/da0-acquisition-contracts, feat/da1-idox-family-preflight]
    paths: ['verification/da0/**', '.github/workflows/da0-contract-offline.yml', 'docs/design/da0-acquisition-contract/**', 'docs/design/idox-family-preflight/**', 'verification/idox_family/**']
  pull_request:
    paths: ['verification/da0/**', '.github/workflows/da0-contract-offline.yml', 'docs/design/da0-acquisition-contract/**', 'docs/design/idox-family-preflight/**', 'verification/idox_family/**']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 beautifulsoup4==4.12.3 soupsieve==2.6 PyYAML==6.0.2
      - run: python -m pytest verification/da0/test_contracts.py verification/idox_family/test_preflight.py -q

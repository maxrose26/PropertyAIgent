name: DA0 offline contracts
on:
  push:
    branches: [feat/da0-acquisition-contracts, feat/da1-salford-entry-preflight]
    paths: ['verification/da0/**', '.github/workflows/da0-contract-offline.yml', 'docs/design/da0-acquisition-contract/**', 'docs/design/salford-entry-preflight/**', 'verification/salford_entry/**']
  pull_request:
    paths: ['verification/da0/**', '.github/workflows/da0-contract-offline.yml', 'docs/design/da0-acquisition-contract/**', 'docs/design/salford-entry-preflight/**', 'verification/salford_entry/**']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest verification/da0/test_contracts.py verification/salford_entry/test_qualification.py -q

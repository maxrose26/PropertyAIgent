name: DA0 offline contracts
on:
  push:
    branches: [feat/da0-acquisition-contracts]
    paths: ['verification/da0/**', 'verification/da0/test_contracts.py', 'verification/da0/registry_fixtures.json', '.github/workflows/da0-contract-offline.yml', 'docs/design/da0-acquisition-contract/**']
  pull_request:
    paths: ['verification/da0/**', 'verification/da0/test_contracts.py', 'verification/da0/registry_fixtures.json', '.github/workflows/da0-contract-offline.yml', 'docs/design/da0-acquisition-contract/**']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest verification/da0/test_contracts.py -q

# Finite qualification of the STABLE restricted credentials. Restricted credentials ONLY: no administrative credential, no database migration identity and no write-capable GitHub token exist in this job.
# One fixed attempt sequence (at most 3 per restricted login, 6 in total, fixed spacing); a new sequence is a new reviewed workflow decision (this workflow is single-use by run number).
name: Stage4 stable credential qualification ONCE
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        required: true
        type: string
      authority:
        required: true
        type: choice
        default: NOT_AUTHORISED
        options: [NOT_AUTHORISED, AUTHORISE_INGESTION_STABLE_CREDENTIAL_QUALIFICATION_ONCE_20261020]
permissions:
  contents: read
concurrency:
  group: stage4-stable-credential-qualification
  cancel-in-progress: false
jobs:
  qualify:
    environment: stage4-production-canary
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact single-use qualification authority
        env:
          PIN: ${{ inputs.reviewed_sha }}
          WF: ${{ github.workflow_sha }}
          AUTHORITY: ${{ inputs.authority }}
        run: |
          set -euo pipefail
          [[ "$PIN" =~ ^[0-9a-f]{40}$ && "$PIN" == "$WF" && "$PIN" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == refs/heads/master && "$GITHUB_RUN_NUMBER" == 1 && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$AUTHORITY" == AUTHORISE_INGESTION_STABLE_CREDENTIAL_QUALIFICATION_ONCE_20261020 ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - name: Pinned dependencies without production credentials
        run: timeout --kill-after=2s 120s bash verification/ah_pg/setup.sh "$RUNNER_TEMP/qualification-venv"
      - name: Qualify the restricted credentials (restricted credentials only)
        env:
          PIN: ${{ inputs.reviewed_sha }}
          AUTHORITY: ${{ inputs.authority }}
          WF: ${{ github.workflow_sha }}
          INGESTION_WORKER_DATABASE_URL: ${{ secrets.INGESTION_WORKER_DATABASE_URL }}
          INGESTION_EFFECT_DATABASE_URL: ${{ secrets.INGESTION_EFFECT_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/stable-qualification"
          # Enforced resource limits for the qualification process and its children: no core files, 64 open files, 4 MiB maximum file size, 3 GiB address space (hard wall time: timeout below).
          ulimit -c 0; ulimit -n 64; ulimit -f 4096; ulimit -v 3145728
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKFLOW_SHA="$WF" GITHUB_REF="$GITHUB_REF" GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" QUALIFICATION_REVIEWED_SHA="$PIN" QUALIFICATION_AUTHORITY="$AUTHORITY" INGESTION_WORKER_DATABASE_URL="$INGESTION_WORKER_DATABASE_URL" INGESTION_EFFECT_DATABASE_URL="$INGESTION_EFFECT_DATABASE_URL" timeout --kill-after=5s 345s "$RUNNER_TEMP/qualification-venv/bin/python" -I -B -c 'import os,runpy,sys; sys.path.insert(0,os.getcwd()); runpy.run_module("verification.ingestion_storage.stable_qualification",run_name="__main__")' --output "$RUNNER_TEMP/stable-qualification/out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-credential-qualification-${{ github.run_id }}-${{ inputs.reviewed_sha }}
          path: ${{ runner.temp }}/stable-qualification/out
          if-no-files-found: warn
          retention-days: 30

name: Stage4 instrumented public-source probe
on:
  pull_request:
    paths:
      - verification/direct_reference/instrumented_probe.py
      - verification/direct_reference/arcus_http_probe.py
      - verification/direct_reference/INSTRUMENTED_PROBE.md
      - tests/test_instrumented_probe.py
      - .github/workflows/stage4-instrumented-probe.yml
permissions:
  contents: read
concurrency:
  group: stage4-instrumented-public-source-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'maxrose26/PropertyAIgent' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'stage4/instrumented-source-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing browser dependencies
        run: |
          python -m pip install playwright==1.63.0 psutil==7.2.2 requests==2.34.2
          python -m playwright install --with-deps chromium --only-shell
      - name: Focused offline contracts
        run: python -m unittest tests.test_instrumented_probe -v
      - name: Frozen Arcus guest-route observations
        run: |
          mkdir -p "$RUNNER_TEMP/stage4-probe-audit"
          probe_result=0
          for probe_case in salford; do
            python -m verification.direct_reference.instrumented_probe --case "$probe_case" --output "$RUNNER_TEMP/stage4-probe-audit/$probe_case.json" || probe_result=1
            python -c 'import json,sys; a=json.load(open(sys.argv[1])); sys.exit(0 if a.get("process_cleanup")=="CLOSED" and not a.get("supervisor_limit_hit",True) else 1)' "$RUNNER_TEMP/stage4-probe-audit/$probe_case.json"
          done
          exit "$probe_result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage4-instrumented-probe-${{ github.run_id }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/stage4-probe-audit/*.json
          if-no-files-found: warn
          retention-days: 14

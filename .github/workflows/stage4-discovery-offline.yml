name: Stage4 discovery contract OFFLINE
on:
  pull_request:
    paths:
      - 'docs/design/ingestion-provisioning-20261016/*.sql'
      - 'app/ingestion/**'
      - 'verification/ingestion_storage/**'
      - '.github/workflows/stage4-ingestion-storage-catalogue-once.yml'
      - 'app/pipeline/discovery_*.py'
      - 'app/pipeline/run_weekly.py'
      - 'app/pipeline/site_linking.py'
      - 'app/pipeline/status_verification.py'
      - 'app/pipeline/bolton_initial_status.py'
      - 'app/scrapers/idox_portal.py'
      - 'app/scrapers/discovery_idox.py'
      - 'app/scrapers/arcus_portal.py'
      - 'tests/test_discovery_*.py'
      - 'tests/test_instrumented_probe.py'
      - 'tests/fixtures/discovery/**'
      - 'verification/bolton_recon/*.py'
      - 'verification/discovery/**'
      - '.github/workflows/stage4-catchup-completion-*.yml'
      - '.github/workflows/stage4-manchester-20261015-once.yml'
      - '.github/workflows/stage4-bolton-delta3-comparison-once.yml'
      - '.github/workflows/stage4-oldham-two-capture-once.yml'
      - 'tests/test_discovery_narrow_continuation.py'
      - 'tests/test_discovery_completion.py'
      - 'tests/test_discovery_completion_blockers.py'
      - 'verification/stage26b_l1/request_boundary.py'
      - 'tests/test_discovery_autonomous_mandate.py'
      - '.github/workflows/stage4-r0-selective5-admission-once.yml'
      - '.github/workflows/stage4-r0-mandate-partitions8-once.yml'
      - '.github/workflows/stage4-r0-mandate-untouched5-once.yml'
      - '.github/workflows/stage4-r0-mandate-unresolved4-once.yml'
      - 'docs/design/stage4-r0-execution/**'
      - 'verification/direct_reference/instrumented_probe.py'
      - '.github/workflows/stage4-discovery-offline.yml'
      - '.github/workflows/stage4-route-qualified-material-admission-once.yml'
      - '.github/workflows/stage4-r0-source-date-once.yml'
      - '.github/workflows/stage4-r0-identity-comparison-once.yml'
      - '.github/workflows/stage4-r0-untouched-recovery-once.yml'
      - '.github/workflows/stage4-r0-fixed80-qualification-once.yml'
      - '.github/workflows/stage4-r0-untouched27-once.yml'
      - '.github/workflows/stage4-r0-untouched20-once.yml'
      - '.github/workflows/stage4-r0-bolton53-qualification-once.yml'
      - '.github/workflows/stage4-r0-untouched16-once.yml'
      - '.github/workflows/stage4-r0-untouched9-once.yml'
      - '.github/workflows/stage4-bolton-two-parent-metadata-once.yml'
      - 'tests/test_discovery_r0_registration.py'
      - '.github/workflows/stage4-batch-offline.yml'
      - 'tests/test_stage4_batch_registration.py'
      - 'tests/test_oldham_production_registration.py'
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/discovery-venv"
      - name: Pure discovery and pagination regressions, network denied
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" verification/ah-offline-pytest.py tests/test_discovery_ingestion_acceptance.py tests/test_discovery_ingestion_operational.py tests/test_discovery_ingestion_worker_interface.py tests/test_discovery_ingestion_credential_mapping.py tests/test_discovery_ingestion_storage_access.py tests/test_discovery_ingestion_ledger.py tests/test_discovery_screening_assessment.py tests/test_discovery_metadata_rollout.py tests/test_l1_registration_request_safety.py tests/test_discovery_narrow_continuation.py tests/test_discovery_completion_blockers.py tests/test_discovery_completion.py tests/test_discovery_autonomous_mandate.py tests/test_discovery_parent_registration.py tests/test_discovery_exact9_registration.py tests/test_discovery_parent_controls.py tests/test_discovery_bolton53_admission.py tests/test_discovery_criteria_containment.py tests/test_discovery_capped_criteria_screening.py tests/test_discovery_exact9_parent_preparation.py tests/test_discovery_exact16_registration.py tests/test_discovery_exact16_proposal.py tests/test_discovery_bolton53_registration.py tests/test_discovery_initial_application_contract.py tests/test_discovery_r0_registered_scopes.py tests/test_discovery_page_cap_transport.py tests/test_discovery_fixed80_qualification.py tests/test_discovery_finite_acceptance.py tests/test_discovery_r0_proposal.py tests/test_discovery_r0_recovery_proposal.py tests/test_discovery_r0_executable_proposals.py tests/test_discovery_r0_registration.py tests/test_discovery_contract.py tests/test_discovery_acceptance.py tests/test_discovery_admission.py tests/test_discovery_pagination.py tests/test_discovery_form_shape.py verification/bolton_recon/test_recon.py tests/test_instrumented_probe.py tests/test_discovery_arcus_shape.py tests/test_discovery_idox_listing.py tests/test_discovery_idox_window.py tests/test_discovery_idox_family.py tests/test_discovery_remaining_source.py tests/test_discovery_arcus_ui.py tests/test_discovery_arcus_transport.py -q --junitxml="$RUNNER_TEMP/discovery.xml"
      - name: Existing Stage2 unit extraction and persistence, synthetic provider only
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" verification/ah-offline-pytest.py -p verification.stage1_preservation_plugin tests/test_discovery_ingestion_unit_acceptance.py -q --junitxml="$RUNNER_TEMP/unit-acceptance.xml"
      - name: Disposable loopback TLS trust and failed-handle cleanup
        run: |
          timeout --kill-after=2s 30s env -i HOME="$HOME" PATH=/usr/bin:/bin "$RUNNER_TEMP/discovery-venv/bin/python" -m pytest tests/test_discovery_ingestion_tls_trust.py -q
      - name: Fixed committee caller and field-level B2, network denied
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" verification/ah-offline-pytest.py tests/test_discovery_committee_exact.py tests/test_planning_status_verification.py tests/test_field_level_verification.py tests/test_arcus_b2_adapter.py tests/test_arcus_transport.py -q
      - name: Rejected evidence audit, network denied
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" verification/ah-offline-pytest.py tests/test_discovery_rejection_audit.py tests/test_discovery_material_qualification.py tests/test_discovery_material_admission.py tests/test_discovery_route_validation.py tests/test_discovery_admission_proposal.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-offline-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/discovery.xml
            ${{ runner.temp }}/unit-acceptance.xml
  postgres-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: discovery_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: stage4_discovery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/discovery-venv"
      - name: Disposable database concurrency and lost acknowledgement
        run: |
          timeout --kill-after=2s 60s env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: DISCOVERY_TEST_POSTGRES_URL=postgresql+psycopg://discovery_test:disposable_test_only@127.0.0.1:5432/stage4_discovery_test "$RUNNER_TEMP/discovery-venv/bin/python" -m pytest tests/test_discovery_admission_pg.py tests/test_discovery_ingestion_pg.py -q --junitxml="$RUNNER_TEMP/discovery-pg.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-pg-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/discovery-pg.xml

  restricted-provisioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: provisioning_bootstrap
          POSTGRES_PASSWORD: disposable_fixture_only
          POSTGRES_DB: ingestion_provisioning_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U provisioning_bootstrap -d ingestion_provisioning_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: timeout --kill-after=2s 90s bash verification/ah_pg/setup.sh "$RUNNER_TEMP/provisioning-venv"
      - name: Non-superuser exact provisioning and real login denials, disposable only
        run: |
          timeout --kill-after=2s 60s env -i HOME="$HOME" PATH=/usr/bin:/bin INGESTION_PROVISIONING_TEST_URL=postgresql://provisioning_bootstrap:disposable_fixture_only@127.0.0.1:5432/ingestion_provisioning_test "$RUNNER_TEMP/provisioning-venv/bin/python" -m pytest tests/test_discovery_ingestion_provisioning_pg.py tests/test_discovery_ingestion_operational_pg.py tests/test_discovery_ingestion_acceptance_native.py -q --junitxml="$RUNNER_TEMP/provisioning.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-provisioning-disposable-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/provisioning.xml
          retention-days: 14

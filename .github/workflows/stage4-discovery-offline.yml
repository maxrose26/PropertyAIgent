jobs:
  v3-admission-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: provisioning_bootstrap
          POSTGRES_PASSWORD: disposable_fixture_only
          POSTGRES_DB: ingestion_provisioning_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U provisioning_bootstrap -d ingestion_provisioning_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: timeout --kill-after=2s 90s bash verification/ah_pg/setup.sh "$RUNNER_TEMP/handoff-venv"
      - name: Retained v3 nominee through restricted SQL ledger and shared writer, disposable only
        run: |
          timeout --kill-after=2s 165s env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: INGESTION_PROVISIONING_TEST_URL=postgresql://provisioning_bootstrap:disposable_fixture_only@127.0.0.1:5432/ingestion_provisioning_test "$RUNNER_TEMP/handoff-venv/bin/python" -m tests.v3_admission_supervised "$RUNNER_TEMP/v3-admission"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/v3-admission/
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/discovery-venv"
      - name: Pure discovery and pagination regressions, network denied
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" verification/ah-offline-pytest.py tests/test_discovery_ingestion_batching.py tests/test_discovery_ingestion_acceptance.py tests/test_discovery_ingestion_operational.py tests/test_discovery_ingestion_worker_interface.py tests/test_discovery_ingestion_credential_mapping.py tests/test_discovery_ingestion_storage_controller.py tests/test_discovery_ingestion_storage_access.py tests/test_discovery_ingestion_ledger.py tests/test_discovery_screening_assessment.py tests/test_discovery_metadata_rollout.py tests/test_l1_registration_request_safety.py tests/test_discovery_narrow_continuation.py tests/test_discovery_completion_blockers.py tests/test_discovery_four_council_proof.py tests/test_discovery_four_council_release.py tests/test_discovery_three_council_isolation.py tests/test_discovery_failure_reporting.py tests/test_discovery_completion.py tests/test_discovery_autonomous_mandate.py tests/test_discovery_parent_registration.py tests/test_discovery_exact9_registration.py tests/test_discovery_parent_controls.py tests/test_discovery_bolton53_admission.py tests/test_discovery_criteria_containment.py tests/test_discovery_capped_criteria_screening.py tests/test_discovery_exact9_parent_preparation.py tests/test_discovery_exact16_registration.py tests/test_discovery_exact16_proposal.py tests/test_discovery_bolton53_registration.py tests/test_discovery_initial_application_contract.py tests/test_discovery_r0_registered_scopes.py tests/test_discovery_page_cap_transport.py tests/test_discovery_fixed80_qualification.py tests/test_discovery_finite_acceptance.py tests/test_discovery_r0_proposal.py tests/test_discovery_r0_recovery_proposal.py tests/test_discovery_r0_executable_proposals.py tests/test_discovery_r0_registration.py tests/test_discovery_contract.py tests/test_discovery_acceptance.py tests/test_discovery_admission.py tests/test_discovery_pagination.py tests/test_discovery_form_shape.py verification/bolton_recon/test_recon.py tests/test_instrumented_probe.py tests/test_discovery_arcus_shape.py tests/test_discovery_idox_listing.py tests/test_discovery_idox_window.py tests/test_discovery_idox_family.py tests/test_discovery_remaining_source.py tests/test_discovery_arcus_ui.py tests/test_discovery_arcus_transport.py tests/test_prepared_font_cache.py tests/test_prepared_font_cache_residency.py -q --junitxml="$RUNNER_TEMP/discovery.xml"
      - name: Existing Stage2 unit extraction and persistence, synthetic provider only
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" verification/ah-offline-pytest.py -p verification.stage1_preservation_plugin tests/test_discovery_ingestion_unit_acceptance.py -q --junitxml="$RUNNER_TEMP/unit-acceptance.xml"
      - name: Disposable loopback TLS trust and failed-handle cleanup
        run: |
          timeout --kill-after=2s 30s env -i HOME="$HOME" PATH=/usr/bin:/bin "$RUNNER_TEMP/discovery-venv/bin/python" -m pytest tests/test_discovery_ingestion_tls_trust.py -q
      - name: Actionable native driver diagnostics and failure closure, loopback only
        run: |
          timeout --kill-after=2s 40s env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" -m pytest tests/test_ingestion_actionable_release_binding.py tests/test_ingestion_connection_actionable.py tests/test_ingestion_direct_route.py tests/test_discovery_ingestion_operational_failure.py tests/test_ingestion_operational_pooler_identity.py -q --junitxml="$RUNNER_TEMP/connection-actionable.xml"
      - name: Stage-attributed connection preparation, real entrypoint and session, loopback only
        run: |
          timeout --kill-after=2s 60s env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" -m pytest tests/test_ingestion_preparation_stages.py -v --junitxml="$RUNNER_TEMP/preparation-stages.xml"
      - name: Administrative connection probe, server-observed statements, disposable PostgreSQL only
        run: |
          timeout --kill-after=2s 90s env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: INGESTION_REQUIRE_LOCAL_PG=1 "$RUNNER_TEMP/discovery-venv/bin/python" -m pytest tests/test_ingestion_admin_connection_probe.py -v --junitxml="$RUNNER_TEMP/admin-probe.xml"
      - name: Restricted connection matrix, server-observed, disposable PostgreSQL only
        run: |
          timeout --kill-after=2s 90s env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: INGESTION_REQUIRE_LOCAL_PG=1 "$RUNNER_TEMP/discovery-venv/bin/python" -m pytest tests/test_ingestion_restricted_matrix.py tests/test_ingestion_restricted_matrix_package.py tests/test_ingestion_hard_deadline.py tests/test_ingestion_statement_deadline.py tests/test_ingestion_deadline_arithmetic.py tests/test_ingestion_preflight_policy_state.py tests/test_ingestion_direct_route_package.py tests/test_ingestion_stable_credentials_package.py tests/test_ingestion_pipeline_invalidation.py tests/test_ingestion_pipeline_failure_path.py tests/test_ingestion_stable_pipeline.py tests/test_ingestion_pipeline_publication_and_diagnostics.py tests/test_ingestion_control_observation.py tests/test_ingestion_observation_input_precheck.py tests/test_ingestion_form_probe_source.py tests/test_ingestion_form_probe_owner.py tests/test_ingestion_capture_acceptance_owner.py tests/test_ingestion_window_demonstration_owner.py tests/test_ingestion_owner_result_sealing.py tests/test_ci_kernel_diagnostics.py tests/test_ingestion_listing_observation.py tests/test_spec035_residential_count_examples.py tests/test_ingestion_count_assessment.py tests/test_ingestion_window_completeness.py tests/test_ingestion_source_form_gate.py tests/test_ingestion_stable_qualification.py tests/test_ingestion_stable_qualification_receipts.py tests/test_ingestion_stable_qualification_workflow.py tests/test_ingestion_operational_settled_r2_package.py tests/test_ingestion_operational_settling.py tests/test_ingestion_operational_settled_package.py tests/test_ingestion_operational_capture_package.py tests/test_ingestion_owner_teardown_policy.py tests/test_ingestion_surviving_session_privileges.py -v --junitxml="$RUNNER_TEMP/restricted-matrix.xml"
      - name: Digit-run stall regression, end-to-end screening bounded under a hard timeout (offline, child processes)
        run: |
          timeout --kill-after=2s 180s env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" -m pytest tests/test_unit_filter_digit_runs.py tests/test_ingestion_count_assessment.py -q -x -p no:cacheprovider
      - name: Screening rule v3, explicit selection, bound identity, code binding, retained-capture reconciliation, history, derived worker function, wiring and controller (offline, disposable database only)
        run: |
          timeout --kill-after=2s 900s env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" -m pytest tests/test_ingestion_screening_v3_slice1.py tests/test_ingestion_retained_capture_reconciliation.py tests/test_ingestion_screening_v3_code_binding.py tests/test_ingestion_screening_history.py tests/test_ingestion_screening_v3_worker_sql.py tests/test_ingestion_screening_v3_wiring.py tests/test_ingestion_screening_v3_controller.py tests/test_ingestion_screening_v3_policy.py tests/test_ingestion_screening_v3_world.py tests/test_ingestion_screening_v3_activation_static.py tests/test_ingestion_screening_v3_bounds.py tests/test_ingestion_screening_v3_rollback_doc.py tests/test_ingestion_screening_v3_owner_tooling.py tests/test_ingestion_screening_v3_successor.py -q -p no:cacheprovider
      - name: Stable qualification module imports, builds its engine, negotiates TLS with a local server and is memory-limited under the workflow's enforced resource limits, no external network
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/dry.key" -out "$RUNNER_TEMP/dry.crt" -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost >/dev/null 2>&1
          (ulimit -c 0; ulimit -n 64; ulimit -f 4096; ulimit -v 3145728; env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" DRY_CRT="$RUNNER_TEMP/dry.crt" DRY_KEY="$RUNNER_TEMP/dry.key" "$RUNNER_TEMP/discovery-venv/bin/python" -I -B - <<'PY'
          import os,resource,socket,ssl,sys,threading
          sys.path.insert(0,os.getcwd())
          import psycopg
          from verification.ingestion_storage import stable_qualification as q, restricted_route as rr
          from verification.ingestion_storage.operational_controller import DatabaseBudget
          from verification.ingestion_storage.tls_trust import verified_trust
          # 1. the limit is really in force: address space is capped at 3 GiB and a 3.5 GiB allocation fails
          assert resource.getrlimit(resource.RLIMIT_AS)[0] == 3145728 * 1024, resource.getrlimit(resource.RLIMIT_AS)
          try:
              bytearray(3584 * 1024 * 1024)
          except MemoryError:
              pass
          else:
              raise SystemExit("address-space limit not enforced")
          # 2. the module imports and builds its engine
          ca,_=verified_trust()
          b=DatabaseBudget(connections=1,statements=24,seconds=60)
          b.engine(rr.url("POOLER","ingestion_worker_login","x"),ssl={"sslmode":"verify-full","sslrootcert":str(ca)},hostaddr="192.0.2.1",route="POOLER")
          b.close([])
          assert not q.admitted({})
          # 3. a real TLS negotiation: a local server with a self-signed certificate answers the PostgreSQL SSL request; verify-full against the trusted CA bundle must reject it at certificate verification
          ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER);ctx.load_cert_chain(os.environ["DRY_CRT"],os.environ["DRY_KEY"])
          srv=socket.socket();srv.bind(("127.0.0.1",0));srv.listen(1);port=srv.getsockname()[1]
          seen=[]
          def serve():
              try:
                  conn,_=srv.accept();conn.settimeout(10)
                  conn.recv(8);conn.sendall(b"S")
                  try:ctx.wrap_socket(conn,server_side=True)
                  except ssl.SSLError as e:seen.append(type(e).__name__)
                  conn.close()
              except OSError:pass
          srv.settimeout(20)
          t=threading.Thread(target=serve,daemon=True);t.start()
          try:
              psycopg.connect(host="localhost",hostaddr="127.0.0.1",port=port,dbname="x",user="x",password="x",sslmode="verify-full",sslrootcert=str(ca),gssencmode="disable",connect_timeout=10)
          except psycopg.OperationalError as e:
              assert "certificate verify failed" in str(e), "unexpected failure (not a TLS verification failure): "+type(e).__name__
          else:
              raise SystemExit("unexpected connection")
          t.join(15)
          assert seen,"the server never completed a TLS negotiation with the client"
          print("limits ok; tls negotiated and rejected at certificate verification")
          PY
          )
      - name: Fixed committee caller and field-level B2, network denied
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" verification/ah-offline-pytest.py tests/test_discovery_committee_exact.py tests/test_planning_status_verification.py tests/test_field_level_verification.py tests/test_arcus_b2_adapter.py tests/test_arcus_transport.py -q
      - name: Rejected evidence audit, network denied
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/discovery-venv/bin/python" verification/ah-offline-pytest.py tests/test_discovery_rejection_audit.py tests/test_discovery_material_qualification.py tests/test_discovery_material_admission.py tests/test_discovery_route_validation.py tests/test_discovery_admission_proposal.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-offline-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/discovery.xml
            ${{ runner.temp }}/unit-acceptance.xml
            ${{ runner.temp }}/connection-actionable.xml
  postgres-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: discovery_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: stage4_discovery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/discovery-venv"
      - name: Disposable database concurrency and lost acknowledgement
        run: |
          timeout --kill-after=2s 60s env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: DISCOVERY_TEST_POSTGRES_URL=postgresql+psycopg://discovery_test:disposable_test_only@127.0.0.1:5432/stage4_discovery_test "$RUNNER_TEMP/discovery-venv/bin/python" -m pytest tests/test_discovery_admission_pg.py tests/test_discovery_ingestion_pg.py -q --junitxml="$RUNNER_TEMP/discovery-pg.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-pg-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/discovery-pg.xml

  screening-v3-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 50      # the disposable PostgreSQL rehearsal, policy-v6 tests and the activation lifecycle of the screening-v3 production connection (PR #173 section 5.3); fixed loopback service, no secrets, no council
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: provisioning_bootstrap
          POSTGRES_PASSWORD: disposable_fixture_only
          POSTGRES_DB: ingestion_provisioning_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U provisioning_bootstrap -d ingestion_provisioning_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: timeout --kill-after=2s 90s bash verification/ah_pg/setup.sh "$RUNNER_TEMP/provisioning-venv"
      - name: Screening v3 rehearsal, original function then derived replacement then rollback, disposable PostgreSQL only
        run: |
          timeout --kill-after=2s 600s env -i HOME="$HOME" PATH=/usr/bin:/bin V3_REHEARSAL_TIMINGS="$RUNNER_TEMP/v3-rehearsal-timings.json" INGESTION_REQUIRE_LOCAL_PG=1 INGESTION_PROVISIONING_TEST_URL=postgresql://provisioning_bootstrap:disposable_fixture_only@127.0.0.1:5432/ingestion_provisioning_test "$RUNNER_TEMP/provisioning-venv/bin/python" -m pytest tests/test_ingestion_screening_v3_pg.py tests/test_discovery_ingestion_screening_v3_policy_pg.py -q -s -p no:cacheprovider --basetemp="$RUNNER_TEMP/v3-rehearsal"
      - name: Screening v3 activation lifecycle, owner installation then owner and hosted halves, real accounting, standing restricted credentials, real gh (loopback), disposable PostgreSQL only
        run: |
          timeout --kill-after=2s 1800s env -i HOME="$HOME" PATH=/usr/bin:/bin INGESTION_REQUIRE_LOCAL_PG=1 INGESTION_PROVISIONING_TEST_URL=postgresql://provisioning_bootstrap:disposable_fixture_only@127.0.0.1:5432/ingestion_provisioning_test "$RUNNER_TEMP/provisioning-venv/bin/python" -m pytest tests/test_discovery_ingestion_screening_v3_lifecycle_pg.py -q -s -p no:cacheprovider --basetemp="$RUNNER_TEMP/v3-lifecycle"
      - name: Measured costs of the rehearsal
        if: always()
        run: cat "$RUNNER_TEMP/v3-rehearsal-timings.json" || true

  restricted-provisioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 34      # the existing disposable rehearsals, the stable pipeline lifecycle and the capture-acceptance lifecycle
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: provisioning_bootstrap
          POSTGRES_PASSWORD: disposable_fixture_only
          POSTGRES_DB: ingestion_provisioning_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U provisioning_bootstrap -d ingestion_provisioning_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: timeout --kill-after=2s 90s bash verification/ah_pg/setup.sh "$RUNNER_TEMP/provisioning-venv"
      - name: Real gh starts within from-exec kernel ceiling
        run: |
          sudo systemd-run --scope --unit=propertyaigent-storage-memory-20261017 -p Delegate=memory -p MemoryMax=268435456 -p MemorySwapMax=0 -p OOMPolicy=kill bash verification/ingestion_storage/memory_ci_scope.sh "$(id -u)" "$(id -g)" startup "$RUNNER_TEMP/provisioning-venv/bin/python" -m tests.test_discovery_ingestion_memory_native startup
      - name: Whole-scope excessive memory terminates and cleans up

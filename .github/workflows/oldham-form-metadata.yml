name: Oldham form metadata diagnostic (manual only)
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact REVIEW-approved 40-character commit; must equal workflow revision
        required: true
        type: string
      mode:
        description: Live requires separate Product Owner authority; default is offline
        required: true
        type: choice
        default: offline
        options: [offline, live]
      authority:
        description: OFFLINE_ONLY or separately authorised one-GET diagnostic acknowledgement
        required: true
        type: choice
        default: OFFLINE_ONLY
        options: [OFFLINE_ONLY, AUTHORISE_ONE_OLDHAM_FORM_GET_ONLY]
permissions:
  contents: read
concurrency:
  group: oldham-form-metadata-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Exact workflow and code revision admission
        env:
          PIN: ${{ inputs.reviewed_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          MODE: ${{ inputs.mode }}
          AUTHORITY: ${{ inputs.authority }}
        run: |
          [[ "$PIN" =~ ^[0-9a-f]{40}$ && "$PIN" == "$WORKFLOW_SHA" ]]
          [[ "$MODE" == offline || ( "$MODE" == live && "$AUTHORITY" == AUTHORISE_ONE_OLDHAM_FORM_GET_ONLY ) ]]
          echo "METADATA_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - name: Install existing locked dependencies (not council traffic)
        run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/metadata-venv"
      - name: Bounded audit only; no service credentials inherited
        env:
          PIN: ${{ inputs.reviewed_sha }}
          MODE: ${{ inputs.mode }}
          AUTHORITY: ${{ inputs.authority }}
        run: |
          env -i PATH=/usr/bin:/bin GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/metadata-venv/bin/python" -m verification.stage26b_l1.form_metadata_runner --sha "$PIN" --mode "$MODE" --authority "$AUTHORITY" --deadline 30 --job-start-epoch "$METADATA_JOB_START" --output "$RUNNER_TEMP/form-metadata.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oldham-form-metadata-${{ inputs.reviewed_sha }}
          path: ${{ runner.temp }}/form-metadata.json
          if-no-files-found: error
          retention-days: 7

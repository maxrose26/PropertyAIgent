name: Stage4 committee assessment focused OFFLINE
on:
  pull_request:
    paths: ['verification/committee_assessment_once.py', 'tests/test_committee_assessment_once.py', '.github/workflows/stage4-committee-assessment-*.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/committee-venv"
      - run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/committee-venv/bin/python" verification/ah-offline-pytest.py tests/test_committee_assessment_once.py -q

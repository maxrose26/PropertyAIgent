name: L0 offline dependency acceptance
on:
  push:
    branches: [feat/stage26b-l0-dependency-manifest]
  pull_request:
    paths: ['verification/stage26b_l0/**', 'tests/test_stage26b_l0.py', 'tests/fixtures/stage26b/l0/**', '.github/workflows/l0-offline.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/l0-venv"
      - name: Network-denied qualified fixture acceptance
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/l0-venv/bin/python" verification/ah-offline-pytest.py tests/test_stage26b_l0.py -q --junitxml="$RUNNER_TEMP/l0-results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l0-offline-${{ github.sha }}
          path: ${{ runner.temp }}/l0-results.xml

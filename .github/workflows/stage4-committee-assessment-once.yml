name: Stage4 frozen12month committee evidence assessment ONCE
on:
  push:
    branches: [master]
    paths: ['verification/committee_assessment_once.py']
permissions:
  contents: read
concurrency:
  group: stage4-committee-assessment
  cancel-in-progress: false
jobs:
  assess:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/committee-venv"
      - name: Focused offline tests
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/committee-venv/bin/python" verification/ah-offline-pytest.py tests/test_committee_assessment_once.py -q
      - name: Fixed public assessment without application credentials
        run: |
          timeout --kill-after=2s 630s env -i HOME="$HOME" PATH=/usr/bin:/bin "$RUNNER_TEMP/committee-venv/bin/python" -m verification.committee_assessment_once --output "$RUNNER_TEMP/committee-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committee-evidence-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/committee-evidence/*.json
          retention-days: 14
          if-no-files-found: error

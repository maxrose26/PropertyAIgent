# Focused fallback for discovery workflow startup failures; disposable only.
name: Period08 partial settlement OFFLINE
on:
  pull_request:
    paths:
      - 'verification/ingestion_storage/period08_settlement.py'
      - 'verification/direct_reference/instrumented_probe.py'
      - 'scripts/owner_period08_settlement.py'
      - 'tests/test_period08_settlement_pg.py'
      - 'tests/test_manchester_browser_boundary.py'
      - '.github/workflows/period08-settlement-offline.yml'
permissions:
  contents: read
jobs:
  partial-settlement-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: provisioning_bootstrap
          POSTGRES_PASSWORD: disposable_fixture_only
          POSTGRES_DB: ingestion_provisioning_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U provisioning_bootstrap -d ingestion_provisioning_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: timeout --kill-after=2s 90s bash verification/ah_pg/setup.sh "$RUNNER_TEMP/settlement-venv"
      - name: Partial settlement and credential-free browser boundary
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          INGESTION_PROVISIONING_TEST_URL: postgresql://provisioning_bootstrap:disposable_fixture_only@127.0.0.1:5432/ingestion_provisioning_test
        run: timeout --kill-after=2s 240s "$RUNNER_TEMP/settlement-venv/bin/python" -m pytest tests/test_period08_settlement_pg.py tests/test_manchester_browser_boundary.py -q --tb=short --junitxml="$RUNNER_TEMP/period08-settlement.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: period08-settlement-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/period08-settlement.xml
          if-no-files-found: error

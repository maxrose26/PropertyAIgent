name: B2.0 disposable PostgreSQL 17 rehearsal
on:
  push:
    branches: [feat/stage26b-b20-freshness]
  pull_request:
    paths:
      - 'verification/b20_native/**'
      - '.github/workflows/b20-native-postgres.yml'
permissions:
  contents: read
concurrency:
  group: b20-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: b20_disposable
          POSTGRES_DB: b20_disposable
          POSTGRES_PASSWORD: b20-disposable-only
        ports:
          - '127.0.0.1::5432'
        options: >-
          --health-cmd "pg_isready -U b20_disposable -d b20_disposable"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Install pinned dependencies
        run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/b20-native-venv"
      - name: Synthetic native transaction and concurrency rehearsal
        env:
          B20_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b20-native-evidence"
          env -i HOME=/tmp PATH=/usr/bin:/bin B20_DISPOSABLE=YES_SYNTHETIC_ONLY B20_POSTGRES_PORT="$B20_POSTGRES_PORT" PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 "$RUNNER_TEMP/b20-native-venv/bin/python" -m pytest -v -s -p no:cacheprovider verification/b20_native/test_postgres.py --junitxml="$RUNNER_TEMP/b20-native-evidence/native.xml" 2>&1 | tee "$RUNNER_TEMP/b20-native-evidence/native.log"
      - name: Stop disposable PostgreSQL
        if: always()
        env:
          B20_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/b20-native-evidence"
          docker stop "$B20_SERVICE_ID"
          docker inspect --format '{{json .State}}' "$B20_SERVICE_ID" > "$RUNNER_TEMP/b20-native-evidence/service-stop.json"
          test "$(docker inspect --format '{{.State.Running}}' "$B20_SERVICE_ID")" = false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b20-native-${{ github.sha }}
          path: ${{ runner.temp }}/b20-native-evidence/
          retention-days: 7

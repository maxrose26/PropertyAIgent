name: Tameside transport diagnostics offline
on:
  create:
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'validation/tameside-transport-diagnostics-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Existing pinned dependencies
        run: timeout --kill-after=2s 90s bash verification/ah_pg/setup.sh "$RUNNER_TEMP/diagnostic-venv"
      - name: Only new transport diagnostics and affected legacy transport cases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnostic-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/diagnostic-proof/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/diagnostic-proof/tree.txt"
          sha256sum verification/stage26b_l1/request_boundary.py verification/discovery/source_diagnostics.py verification/discovery/idox_window.py tests/test_tameside_transport_diagnostics.py .github/workflows/tameside-transport-diagnostics.yml > "$RUNNER_TEMP/diagnostic-proof/input-hashes.txt"
          env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 DATABASE_URL=sqlite:///:memory: timeout --kill-after=2s 30s "$RUNNER_TEMP/diagnostic-venv/bin/python" -B -m pytest tests/test_tameside_transport_diagnostics.py tests/test_ingestion_pipeline_publication_and_diagnostics.py::test_unknown_literals_are_never_exported_and_the_schema_is_strict tests/test_ingestion_pipeline_publication_and_diagnostics.py::test_transport_facts_are_those_of_the_failing_request_only tests/test_discovery_four_council_proof.py::test_tameside_sort_request_failure_has_no_invented_body_and_reuses_transport tests/test_ingestion_form_probe_source.py::test_a_transport_exception_is_an_observation_with_no_retry tests/test_ingestion_form_probe_source.py::test_the_application_side_transport_schema_equals_the_verification_side_definition -q -p no:cacheprovider --tb=short --junitxml="$RUNNER_TEMP/diagnostic-proof/diagnostics.xml" 2>&1 | tee "$RUNNER_TEMP/diagnostic-proof/diagnostics.log"
      - name: Export focused evidence
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/diagnostic-proof" <<'PY_EVIDENCE'
          import base64,hashlib,io,pathlib,sys,zipfile
          p=pathlib.Path(sys.argv[1]);buf=io.BytesIO()
          with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(p.iterdir()):
                  if f.is_file():z.writestr(f.name,f.read_bytes())
          b=buf.getvalue()
          assert len(b)<=65536
          print('TAMESIDE_TRANSPORT_DIAGNOSTIC_EVIDENCE_SHA256='+hashlib.sha256(b).hexdigest())
          print('TAMESIDE_TRANSPORT_DIAGNOSTIC_EVIDENCE_BASE64='+base64.b64encode(b).decode())
          PY_EVIDENCE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tameside-transport-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/diagnostic-proof/
          retention-days: 14

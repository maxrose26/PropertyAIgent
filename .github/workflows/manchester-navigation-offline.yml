name: Manchester navigation diagnostic OFFLINE
on:
  pull_request:
    paths:
      - 'verification/discovery/manchester_navigation_diagnostic.py'
      - 'verification/ingestion_storage/operational_supervisor.py'
      - 'verification/ingestion_storage/daily_intake_runtime.py'
      - 'scripts/manchester_navigation_diagnostic.py'
      - 'tests/test_manchester_navigation_diagnostic.py'
      - '.github/workflows/manchester-navigation-offline.yml'
permissions:
  contents: read
jobs:
  browser-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: timeout --kill-after=2s 90s bash verification/ah_pg/setup.sh "$RUNNER_TEMP/mnav-venv"
      - name: Install isolated browser for loopback-only proof
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/propertyaigent-manchester-diagnostic-browser
        run: timeout --kill-after=2s 120s "$RUNNER_TEMP/mnav-venv/bin/python" -m playwright install --with-deps chromium --only-shell
      - name: Worker, transport and supervisor regressions without council access
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/propertyaigent-manchester-diagnostic-browser
          MANCHESTER_REAL_BROWSER: '1'
        run: timeout --kill-after=2s 120s "$RUNNER_TEMP/mnav-venv/bin/python" -m pytest tests/test_manchester_navigation_diagnostic.py tests/test_manchester_browser_boundary.py tests/test_tameside_first_sort_diagnostic.py -q --tb=short --junitxml="$RUNNER_TEMP/mnav.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manchester-navigation-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/mnav.xml
          if-no-files-found: error

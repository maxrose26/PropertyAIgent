name: Bolton literal-status OFFLINE acceptance
on:
  push:
    branches: [feat/l1-bolton-literal-summary]
  pull_request:
    paths: ['verification/stage26b_l1/**', 'tests/test_bolton_literal_summary.py', '.github/workflows/bolton-literal-offline.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch immutable generic Idox regression baseline
        run: git fetch --no-tags --depth=1 origin 27966c34d1b4dbb88c15cd59d0805d55b14af9a7
      - run: bash verification/ah_pg/setup.sh "$RUNNER_TEMP/bolton-venv"
      - name: Network-denied literal-source and existing contract regressions
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin DATABASE_URL=sqlite:///:memory: "$RUNNER_TEMP/bolton-venv/bin/python" verification/ah-offline-pytest.py -p verification.stage1_preservation_plugin tests/test_bolton_literal_summary.py tests/test_l1_actions_canary.py tests/test_l1_registration_request_safety.py tests/test_stage26b_l0.py tests/test_stage26b_b20.py tests/test_stage26b_b21.py tests/test_stage26b_b11.py tests/test_planning_status_verification.py tests/test_material_planning_change_detection.py -q --junitxml="$RUNNER_TEMP/bolton-tests.xml"
      - name: Actual supervisor and mock worker ONLY
        env:
          PIN: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/bolton-venv/bin/python" -m verification.stage26b_l1.bolton_rehearsal --sha "$PIN" --output "$RUNNER_TEMP/bolton-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bolton-OFFLINE-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bolton-tests.xml
            ${{ runner.temp }}/bolton-audit.json
          retention-days: 7
